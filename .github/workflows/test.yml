name: Phase I tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog python3
      - name: Show tool versions
        run: |
          iverilog -V
          python3 --version
      - name: Run tests from a fresh checkout
        run: ./scripts/run_all.sh
